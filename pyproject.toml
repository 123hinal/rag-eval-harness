[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-harness"
version = "0.1.0"
description = "Hybrid RAG pipeline (dense + BM25) with a built-in offline evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
